# ==============================================================================
# Google Cloud Run Service Specification (Knative Serving v1)
# Declarative Infrastructure as Code (IaC) for SolOS ERP
# ==============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: soloos-erp
  labels:
    cloud.googleapis.com/location: asia-northeast3
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/soloos-erp:latest
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: APP_NAME
              value: "SolOS ERP"
            - name: FIREBASE_PROJECT_ID
              value: "soloos-erp"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
