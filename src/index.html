  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    .clean-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
    }
    .clean-card-hover {
      transition: all 0.2s ease-in-out;
    }
    .clean-card-hover:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.08);
    }
    .waterfall-step {
      position: relative;
    }
    @media (min-width: 1024px) {
      .waterfall-step:not(:last-child)::after {
        content: '→';
        position: absolute;
        right: -10px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-weight: 700;
        font-size: 13px;
        z-index: 10;
        pointer-events: none;
        line-height: 1;
      }
    }
    @media (max-width: 1023px) {
      .waterfall-step:not(:last-child)::after {
        display: none;
      }
    }

    /* Policy Contextual Tooltip Styles */
    .policy-tooltip {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .policy-tooltip .policy-tooltip-box {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      z-index: 50;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 290px;
      padding: 11px 13px;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 11px;
      line-height: 1.55;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
      border: 1px solid #334155;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
    }
    .policy-tooltip .policy-tooltip-box::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }
    .policy-tooltip:hover .policy-tooltip-box,
    .policy-tooltip:focus-within .policy-tooltip-box {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }
    .policy-tooltip-right .policy-tooltip-box {
      left: auto;
      right: 0;
      transform: none;
    }
    .policy-tooltip-right .policy-tooltip-box::after {
      left: auto;
      right: 18px;
    }
  </style>

  <!-- Inline Cache Purge for Immediate Update -->

        for (let r of regs) r.unregister();
      });
    }
