      <!-- ==================== VIEW 2: CONVERSATIONAL AGENT MODE (대화형 에이전트 모드) ==================== -->
      <div id="conversationalView" class="hidden max-w-4xl mx-auto space-y-6">
        
        <!-- Conversational Header -->
        <div class="p-6 rounded-2xl clean-card border border-brand-200 flex flex-col md:flex-row md:items-center justify-between gap-4">

            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
              <i data-lucide="bot" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <span>SolOS 인텔리전트 에이전트</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold">대화형 모드 활성</span>

          </div>

            <i data-lucide="arrow-left" class="w-4 h-4 text-brand-600"></i>
            <span>메인 대시보드로 복귀</span>
          </button>
        </div>

        <!-- Chat Container -->
        <div class="clean-card rounded-2xl border border-slate-200 flex flex-col h-[560px]">
          
          <!-- Message Feed -->
          <div class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50/50" id="chatMessageFeed">
            
            <!-- Agent Welcome Message -->
            <div class="flex items-start gap-3">
              <div class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center text-white shrink-0 mt-0.5">
                <i data-lucide="bot" class="w-4 h-4"></i>
              </div>
              <div class="max-w-[85%] rounded-2xl bg-white border border-slate-200 p-4 text-xs text-slate-800 space-y-2 shadow-sm">
                <p class="leading-relaxed">
                  안녕하세요, 정솔로 대표님. <strong>SolOS 1인 사업가 전담 CFO &amp; 워크웨어 어드바이저</strong>입니다.
                </p>
                <p class="leading-relaxed text-slate-500">
                  기업 통장 가용 잔고(₩14,200,000)와 3대 세무(3.3% 사업소득, 10% 부가세 세금계산서, 8.8% 기타소득) 정산 데이터를 실시간 파악하고 있습니다. 무엇을 도와드릴까요?
                </p>
                <!-- Suggested Quick Prompts -->
                <div class="pt-2 flex flex-wrap gap-2">

                    📄 계약서 주요 항목 점검 &amp; 표준 서식 안내
                  </button>
                  <button onclick="sendQuickPrompt('이번 달 세금계산서 발행 부가세 10%랑 3.3% 세금 얼마야?')" class="px-2.5 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-brand-700 text-[11px] font-medium transition-all">
                    💰 10% 부가세 &amp; 3.3% 세무 예비금
                  </button>
                  <button onclick="sendQuickPrompt('정산 지연 현황 관리와 업무 확인 메시지 작성법 알려줘')" class="px-2.5 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-[11px] font-medium transition-all">

                  <button onclick="sendQuickPrompt('이번 주 주요 업무 마감 일정 알려줘')" class="px-2.5 py-1.5 rounded-lg bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-[11px] font-medium transition-all">
                    ⏱️ 이번 주 업무 마감 일정
                  </button>
                  <button onclick="sendQuickPrompt('미사용 SaaS 정기구독 최적화 플랜 알려줘')" class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 text-[11px] font-medium transition-all">
                    📉 SaaS 정기구독 예산 절감 조언
                  </button>
                </div>
              </div>
            </div>

          </div>

          <!-- Chat Input Bar -->
          <div class="p-4 border-t border-slate-200 bg-white">
            <form onsubmit="handleChatSubmit(event)" class="flex items-center gap-2">
              <input type="text" id="chatInput" placeholder="계약서 검토, 10% 부가세·3.3% 세무, 정산 지연 미수금, 일정 조언을 입력하세요..." class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:bg-white transition-all">
              <button type="submit" class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all">
                <span>전송</span>
                <i data-lucide="send" class="w-3.5 h-3.5"></i>
              </button>
            </form>
          </div>

        </div>

      </div>
