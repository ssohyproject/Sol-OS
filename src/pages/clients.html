        <!-- ==================== SUBVIEW 6: 클라이언트 관리 ==================== -->
        <div id="subview-clients" class="space-y-6 hidden">
          
          <!-- Subview Header: 제목 + 등급 기준 툴팁(호버 팝오버) + 기업 등록 버튼 -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-2 border-b border-slate-200/80">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0">
                <i data-lucide="users" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h2 class="text-lg lg:text-xl font-black text-slate-900">클라이언트 관리</h2>
                  
                  <!-- 신뢰 등급 가이드 툴팁 아이콘 & 호버 팝오버 -->
                  <div class="relative group inline-block">
                    <button type="button" class="text-slate-400 hover:text-slate-600 focus:outline-none p-0.5 rounded-full transition-colors flex items-center" aria-label="기업 신뢰 등급 기준 안내">
                      <i data-lucide="help-circle" class="w-4 h-4 text-slate-400 group-hover:text-slate-700"></i>
                    </button>
                    
                    <!-- 툴팁 내용 (마우스 호버/포커스 시 노출, 좌우 짤림 방지 left-0 및 max-w 적용) -->
                    <div class="absolute left-0 top-full mt-2 w-72 sm:w-80 max-w-[calc(100vw-3rem)] p-3.5 bg-slate-900 text-white text-xs rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-focus-within:opacity-100 group-focus-within:visible transition-all duration-200 z-50">
                      <div class="font-bold text-slate-100 mb-2 flex items-center gap-1.5 pb-1.5 border-b border-slate-700">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                        <span>거래처 신뢰 등급 기준</span>
                      </div>
                      <div class="space-y-2 text-[11px] leading-relaxed">
                        <div class="flex items-start gap-2">
                          <span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold shrink-0 text-[10px]">우수</span>
                          <span class="text-slate-300">정산 지연 0일, 수정 요구 명확. 최우선 프로젝트 배정.</span>
                        </div>
                        <div class="flex items-start gap-2">
                          <span class="px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300 font-bold shrink-0 text-[10px]">양호</span>
                          <span class="text-slate-300">납기 내 결제(지연 1~3일 이내). 표준 계약 조건 유지.</span>
                        </div>
                        <div class="flex items-start gap-2">
                          <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold shrink-0 text-[10px]">주의</span>
                          <span class="text-slate-300">평균 정산 7일 이상 지연. 선입금 50% 및 검수 단축 특약 권장.</span>
                        </div>
                        <div class="flex items-start gap-2">
                          <span class="px-1.5 py-0.5 rounded bg-rose-500/20 text-rose-300 font-bold shrink-0 text-[10px]">위험</span>
                          <span class="text-slate-300">14일 이상 연체 이력. 100% 선입금 또는 에스크로 필수 권장.</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">기업별 기본 정보, 필요 서류 체크리스트, 소통 방식을 체계적으로 관리합니다.</p>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <button type="button" onclick="openClientModal()" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                <span>기업 등록</span>
              </button>
              <button onclick="switchSubView('overview')" class="px-3.5 py-1.5 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-brand-600"></i>
                <span>대시보드로 돌아가기</span>
              </button>
            </div>
          </div>

          <!-- Section: 기업 관리카드 (검색창 + 좌측 기업 리스트 + 우측 세부내용) -->
          <div class="clean-card rounded-2xl p-5 sm:p-6 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-slate-100">
              <div>
                <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                  <i data-lucide="building-2" class="w-4 h-4 text-indigo-600"></i>
                  <span>기업 관리카드</span>
                </h3>
                <p class="text-xs text-slate-500 mt-0.5">발주처별 기본 계약 정보, 제출 서류 완비 현황, 업무·소통 방식을 관리합니다.</p>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200 font-bold" id="clientCountBadge">3개사 등록</span>
            </div>

            <!-- 기업 검색창 및 등급 필터 -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-200">
              <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="clientSearchInput" oninput="filterClientList(this.value)" placeholder="기업명, 사업자번호, 담당자명 검색..." class="w-full pl-9 pr-3 py-2 bg-white rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-indigo-500">
              </div>
              <div class="flex items-center gap-1.5 text-xs shrink-0 overflow-x-auto pb-1 sm:pb-0">
                <button type="button" onclick="filterClientByTier('all')" class="client-tier-filter-btn px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-slate-900 text-white" data-tier="all">전체</button>
                <button type="button" onclick="filterClientByTier('우수')" class="client-tier-filter-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white hover:bg-slate-100 text-emerald-700 border border-slate-200" data-tier="우수">우수</button>
                <button type="button" onclick="filterClientByTier('양호')" class="client-tier-filter-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white hover:bg-slate-100 text-blue-700 border border-slate-200" data-tier="양호">양호</button>
                <button type="button" onclick="filterClientByTier('주의')" class="client-tier-filter-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white hover:bg-slate-100 text-amber-700 border border-slate-200" data-tier="주의">주의</button>
                <button type="button" onclick="filterClientByTier('위험')" class="client-tier-filter-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white hover:bg-slate-100 text-rose-700 border border-slate-200" data-tier="위험">위험</button>
              </div>
            </div>

            <!-- 확장형 2열 레이아웃: 좌측 기업 리스트 + 우측 세부 내용 -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <!-- 좌측: 기업 리스트 (버튼형 목록) -->
              <div class="lg:col-span-4 space-y-2 max-h-[640px] overflow-y-auto pr-1" id="clientListBox">
                <!-- Dynamically populated via renderClientList() -->
              </div>

              <!-- 우측: 선택 기업 세부내용 (기본정보 + 서류체크 + 소통방식) -->
              <div class="lg:col-span-8" id="clientDetailBox">
                <!-- Dynamically populated via renderClientDetail(clientId) -->
              </div>
            </div>
          </div>

        </div>

      </div>
