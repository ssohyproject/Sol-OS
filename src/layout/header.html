  <!-- ==================== TOP NAVIGATION HEADER ==================== -->
  <header class="shrink-0 w-full border-b border-slate-200 bg-white/95 backdrop-blur-md px-4 lg:px-6 py-2.5 flex items-center justify-between gap-3 shadow-sm z-30">
    <!-- Left: Brand Logo & Workstream Dropdown placed together on Left -->
    <div class="flex items-center gap-3">
      <!-- Mobile Sidebar Drawer Hamburger Button -->
      <button type="button" onclick="toggleSidebarDrawer()" class="lg:hidden p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200 transition-colors" title="메뉴 열기">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <a href="#overview" onclick="switchSubView('overview')" class="flex items-center gap-2.5 cursor-pointer group hover:opacity-90 transition-all select-none" title="메인 대시보드로 이동">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center shadow-md shadow-brand-500/20 text-white font-bold text-lg group-hover:scale-105 transition-transform">
          <i data-lucide="shield" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-base tracking-tight text-slate-900 group-hover:text-brand-600 transition-colors">SolOS</span>
            <span class="text-[10px] px-1.5 py-0.2 rounded bg-brand-50 text-brand-700 font-semibold border border-brand-200">Light Edition</span>
          </div>
          <div class="text-[10px] text-slate-500">1인 사업가 올인원 워크웨어</div>
        </div>
      </a>

      <div class="hidden sm:block h-6 w-px bg-slate-200 mx-1"></div>

      <!-- Global Workstream Unified Dropdown (좌측 배치) -->
      <div class="relative">
        <button type="button" onclick="toggleWorkstreamDropdown(event)" id="wsDropdownBtn" class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-bold text-slate-800 transition-all shadow-sm">
          <i data-lucide="layers" class="w-3.5 h-3.5 text-brand-600" id="currentWsIcon"></i>
          <span id="currentWsLabel">전체 통합</span>
          <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400"></i>
        </button>
        
        <div id="wsDropdownMenu" class="hidden absolute left-0 mt-2 w-52 bg-white rounded-2xl shadow-xl border border-slate-200 p-1.5 z-50 text-xs space-y-0.5">
          <button type="button" onclick="selectWorkstream('all', '전체 통합', 'layers', 'text-brand-600')" class="w-full text-left px-3 py-2 rounded-xl flex items-center justify-between hover:bg-slate-50 font-semibold text-slate-800 transition-colors">
            <span class="flex items-center gap-2"><i data-lucide="layers" class="w-3.5 h-3.5 text-brand-600"></i>전체 통합</span>
            <span class="w-1.5 h-1.5 rounded-full bg-brand-600"></span>
          </button>
          <button type="button" onclick="selectWorkstream('client', '외주 프로젝트', 'briefcase', 'text-blue-600')" class="w-full text-left px-3 py-2 rounded-xl flex items-center justify-between hover:bg-slate-50 font-semibold text-slate-800 transition-colors">
            <span class="flex items-center gap-2"><i data-lucide="briefcase" class="w-3.5 h-3.5 text-blue-600"></i>외주 프로젝트</span>
            <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
          </button>
          <button type="button" onclick="selectWorkstream('publishing', '디지털 출판', 'book-open', 'text-emerald-600')" class="w-full text-left px-3 py-2 rounded-xl flex items-center justify-between hover:bg-slate-50 font-semibold text-slate-800 transition-colors">
            <span class="flex items-center gap-2"><i data-lucide="book-open" class="w-3.5 h-3.5 text-emerald-600"></i>디지털 출판</span>
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          </button>
          <button type="button" onclick="selectWorkstream('knowledge', '지식창업·강의', 'graduation-cap', 'text-purple-600')" class="w-full text-left px-3 py-2 rounded-xl flex items-center justify-between hover:bg-slate-50 font-semibold text-slate-800 transition-colors">
            <span class="flex items-center gap-2"><i data-lucide="graduation-cap" class="w-3.5 h-3.5 text-purple-600"></i>지식창업·강의</span>
            <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Right Controls: Plain Language, Dual Mode & Mobile QR -->
    <div class="flex items-center gap-2">
      <!-- Accounting Plain Language Toggle (쉬운 재무 용어 모드) -->
      <button onclick="togglePlainLanguageMode()" id="plainLanguageBtn" class="hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 border border-emerald-200 text-emerald-700 hover:bg-emerald-100 transition-all" title="회계 용어를 초보자 친화적 쉬운 표현으로 전환합니다">
        <i data-lucide="eye" class="w-3.5 h-3.5 text-emerald-600"></i>
        <span id="plainLanguageBtnText">쉬운 용어 모드 ON</span>
      </button>

      <!-- Dual Interface Switcher (대시보드형 <-> 대화형) -->
      <div class="hidden sm:flex items-center bg-slate-100 border border-slate-200 p-1 rounded-xl">
        <button onclick="switchViewMode('dashboard')" id="mode-btn-dashboard" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition-all bg-white text-brand-700 shadow-sm">
          <i data-lucide="layout-dashboard" class="w-3.5 h-3.5 text-brand-600"></i>
          <span class="hidden md:inline">대시보드형</span>
        </button>
        <button onclick="switchViewMode('conversational')" id="mode-btn-conversational" class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
          <i data-lucide="bot" class="w-3.5 h-3.5 text-slate-500"></i>
          <span class="hidden md:inline">대화형 (AI)</span>
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        </button>
      </div>

      <!-- Mobile QR Code Button (실제 스마트폰 스캔 연결) -->
      <button id="qrModalBtn" onclick="openQrModal()" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-semibold text-slate-700 hover:text-slate-900 bg-white hover:bg-slate-50 border border-slate-200 rounded-xl shadow-xs transition-all" title="스마트폰으로 스캔하여 모바일에서 열기">
        <i data-lucide="qr-code" class="w-3.5 h-3.5 text-brand-600"></i>
        <span>QR</span>
      </button>
    </div>
  </header>
