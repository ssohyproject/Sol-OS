  <!-- ==================== MODAL 16: 새 계약 등록 모달 ==================== -->
  <div id="contractRegisterModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-xs">
            <i data-lucide="file-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">새 프로젝트 계약 등록</h2>
            <p class="text-[11px] text-slate-500">계약 정보를 등록하여 납품·검수 및 자금 현황과 연동합니다.</p>
          </div>
        </div>
        <button type="button" onclick="closeContractRegisterModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="contractRegisterForm" onsubmit="handleContractRegisterSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">프로젝트명 <span class="text-rose-500">*</span></label>
          <input type="text" id="crfProjectName" required placeholder="예: 브랜드 웹사이트 리뉴얼" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-bold text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">발주처(클라이언트) 회사명 <span class="text-rose-500">*</span></label>
          <input type="text" id="crfClientName" required placeholder="예: (주)에이비씨컴퍼니" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-medium text-slate-800">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">계약 총액 (원) <span class="text-rose-500">*</span></label>
            <input type="number" id="crfTotalAmount" required placeholder="예: 3000000" class="w-full p-2.5 rounded-xl border border-slate-200 font-mono font-bold text-slate-900">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">미수 잔금 (원)</label>
            <input type="number" id="crfUnpaidAmount" placeholder="예: 1500000" class="w-full p-2.5 rounded-xl border border-slate-200 font-mono font-bold text-rose-600">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">납품 예정일</label>
            <input type="date" id="crfDeliveryDate" class="w-full p-2.5 rounded-xl border border-slate-200 font-mono text-xs">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">검수 기한 (만료일)</label>
            <input type="date" id="crfInspectionDate" class="w-full p-2.5 rounded-xl border border-slate-200 font-mono text-xs">
          </div>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">계약 진행 상태</label>
          <select id="crfStatus" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white">
            <option value="drafting">작성 중</option>
            <option value="reviewing">AI 검토 중</option>
            <option value="negotiating">수정 협의 중</option>
            <option value="signed" selected>체결 완료</option>
            <option value="in_progress">이행 중 (납품·검수)</option>
          </select>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeContractRegisterModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition-all">
            계약 등록 완료
          </button>
        </div>
      </form>
    </div>
  </div>
