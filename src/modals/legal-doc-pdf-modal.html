  <!-- ==================== MODAL 18: [L-03] 납품·검수 기록 문서 생성 (PDF) 모달 ==================== -->
  <div id="legalDocPdfModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-lg w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-xs">
            <i data-lucide="file-check" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">납품·검수 기록 문서 생성 (PDF)</h2>
            <p class="text-[11px] text-slate-500">단순 업무 기록 및 확인용 문서이며 법률적 효력을 보장하는 공문서가 아닙니다.</p>
          </div>
        </div>
        <button type="button" onclick="closeLegalDocPdfModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3.5 text-xs">
        <!-- [L-03] Document Type Selector -->
        <div>
          <label class="block font-bold text-slate-800 mb-1">문서 구분 선택 <span class="text-rose-500">*</span></label>
          <div class="grid grid-cols-2 gap-2">
            <label class="p-3 rounded-xl border border-indigo-200 bg-indigo-50/50 flex items-start gap-2 cursor-pointer hover:bg-indigo-50">
              <input type="radio" name="pdfDocType" value="request" checked onchange="handlePdfDocTypeChange()" class="mt-0.5 text-indigo-600">
              <div>
                <span class="font-bold text-indigo-950 block">검수 확인 요청서</span>
                <span class="text-[10px] text-slate-500">산출물 전달 사실 및 확인 일정을 안내하는 업무 문서</span>
              </div>
            </label>
            <label class="p-3 rounded-xl border border-slate-200 bg-white flex items-start gap-2 cursor-pointer hover:bg-slate-50">
              <input type="radio" name="pdfDocType" value="acceptance" onchange="handlePdfDocTypeChange()" class="mt-0.5 text-emerald-600">
              <div>
                <span class="font-bold text-slate-900 block">검수 완료 확인 기록</span>
                <span class="text-[10px] text-slate-500">상대방의 실제 서면 승인이 확인된 경우의 보관 서식</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Project Fields -->
        <div class="space-y-2">
          <div>
            <label class="block font-bold text-slate-700 mb-1">프로젝트명</label>
            <input type="text" id="pdfProjName" value="브랜드 홈페이지 제작" class="w-full p-2.5 rounded-xl border border-slate-200 font-bold text-slate-900">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-medium text-slate-700 mb-1">발주처(클라이언트)</label>
              <input type="text" id="pdfClientName" value="글로벌이커머스(주)" class="w-full p-2.5 rounded-xl border border-slate-200 font-medium text-slate-800">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">납품 일자</label>
              <input type="date" id="pdfDeliveryDate" value="2026-10-15" class="w-full p-2.5 rounded-xl border border-slate-200 font-mono text-xs">
            </div>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">납품 산출물 상세 내역</label>
            <input type="text" id="pdfDeliverableDesc" value="반응형 웹 퍼블리싱 소스코드 및 그래픽 디자인 에셋 v1.1" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs">
          </div>
        </div>

        <!-- Approval Evidence Notice -->
        <div id="pdfApprovalNoticeBox" class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-[11px] text-slate-600 space-y-1">
          <div class="font-bold text-slate-800 flex items-center gap-1.5">
            <i data-lucide="info" class="w-3.5 h-3.5 text-indigo-600"></i>
            <span>문서 작성 안내:</span>
          </div>
          <p id="pdfApprovalNoticeText">
            검수 요청서는 산출물 전달 사실과 계약상 검수 일정을 서면으로 확인 요청하는 일반 업무 문서입니다.
          </p>
        </div>

        <!-- Preview & Export -->
        <div class="flex items-center justify-between pt-2 border-t border-slate-100">
          <span class="text-[10px] text-slate-400">※ 인쇄 및 PDF 저장이 브라우저 창에서 진행됩니다.</span>
          <div class="flex items-center gap-2">
            <button type="button" onclick="closeLegalDocPdfModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">취소</button>
            <button type="button" onclick="generateAccurateLegalPDF()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm transition-all">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>기록 PDF 내려받기</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
