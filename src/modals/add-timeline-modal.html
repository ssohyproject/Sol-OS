  <!-- ==================== MODAL 19: 새 증빙 타임라인 기록 추가 모달 ==================== -->
  <div id="addTimelineModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shadow-xs">
            <i data-lucide="clock" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">새 증빙 타임라인 기록 추가</h2>
            <p class="text-[11px] text-slate-500">프로젝트 이행 과정의 주요 사실관계를 기록합니다.</p>
          </div>
        </div>
        <button type="button" onclick="closeAddTimelineModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="addTimelineForm" onsubmit="handleAddTimelineSubmit(event)" class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">기록 일시 <span class="text-rose-500">*</span></label>
          <input type="datetime-local" id="tlfDateTime" required class="w-full p-2.5 rounded-xl border border-slate-200 font-mono text-xs">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">기록 제목 (이행 사건) <span class="text-rose-500">*</span></label>
          <input type="text" id="tlfTitle" required placeholder="예: 2차 수정본 이메일 재전송" class="w-full p-2.5 rounded-xl border border-slate-200 font-bold text-slate-900">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">상세 내용 및 수신자/경로</label>
          <textarea id="tlfDesc" rows="3" placeholder="예: 수정 요구사항 3건 반영본 이메일 발송 완료 (수신: client@example.com)" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs resize-none"></textarea>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">기록 구분</label>
          <select id="tlfType" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white">
            <option value="user" selected>사용자 등록 기록 (파일 전송, 미팅 피드백 등)</option>
            <option value="system">시스템 발송 기록 (공식 이메일, 문서 발송)</option>
          </select>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
          <button type="button" onclick="closeAddTimelineModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition-colors">취소</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-sm transition-all">
            타임라인 추가
          </button>
        </div>
      </form>
    </div>
  </div>
