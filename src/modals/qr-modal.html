  <!-- MODAL 6: Mobile QR Code & PWS Modal -->
  <div id="qrModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-5 text-center">
      <div class="flex items-center justify-between pb-2 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center">
            <i data-lucide="smartphone" class="w-4 h-4"></i>
          </div>
          <h2 class="text-base font-bold text-slate-900 text-left">스마트폰으로 모바일 SoloOS 열기</h2>
        </div>
        <button type="button" onclick="closeQrModal()" class="text-slate-400 hover:text-slate-700 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- QR Code Image Box -->
      <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200 inline-block mx-auto shadow-inner">
        <img id="qrCodeImg" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://solo-os.kr" alt="SoloOS 모바일 접속 QR 코드" class="w-48 h-48 mx-auto rounded-xl bg-white p-2 border border-slate-200">
        <p class="text-[11px] text-slate-500 mt-2 font-medium">스마트폰 기본 카메라로 비추면 모바일 SoloOS가 즉시 열립니다</p>
      </div>

      <!-- Public Live Mobile URL & Copy -->
      <div class="space-y-1.5 text-left">
        <label class="block text-[11px] font-bold text-slate-700">모바일 접속 전용 실시간 웹 URL</label>
        <div class="p-2.5 bg-slate-100 rounded-xl flex items-center justify-between text-xs font-mono text-slate-800 border border-slate-200">
          <a id="qrUrlLink" href="https://solo-os.kr" target="_blank" rel="noopener" class="truncate text-blue-600 hover:underline font-bold" id="qrUrlText">https://solo-os.kr</a>
          <button type="button" onclick="copyAppUrl()" class="px-3 py-1.5 bg-white hover:bg-slate-50 rounded-lg border border-slate-300 font-sans font-bold text-slate-800 text-[11px] shrink-0 ml-2 shadow-xs transition-colors">
            URL 복사
          </button>
        </div>
        <p class="text-[10px] text-slate-500">※ LTE/5G 스마트폰 및 외부 네트워크에서도 즉시 접속 가능합니다.</p>
      </div>

      <!-- PWS (Progressive Web Service) Installation Steps -->
      <div class="text-left text-xs space-y-2 p-3.5 rounded-2xl bg-indigo-50/50 border border-indigo-100 text-slate-700">
        <div class="font-bold text-indigo-950 flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <i data-lucide="smartphone" class="w-3.5 h-3.5 text-indigo-600"></i>
            <span>모바일 홈 화면 앱 설치 (PWS)</span>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold bg-indigo-100 text-indigo-800">Firebase PWS Ready</span>
        </div>
        <ul class="text-[11px] space-y-1 text-slate-600 list-disc pl-4 leading-relaxed">
          <li><strong>아이폰 (Safari)</strong>: 하단 <strong>공유(네모+화살표)</strong> 버튼 ➔ <strong>'홈 화면에 추가'</strong></li>
          <li><strong>안드로이드 (Chrome)</strong>: 우측 상단 <strong>메뉴(점 3개)</strong> ➔ <strong>'홈 화면에 추가'</strong></li>
        </ul>
      </div>

      <button type="button" onclick="closeQrModal()" class="w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-xs hover:bg-slate-800 transition-colors">
        닫기
      </button>
    </div>
  </div>
