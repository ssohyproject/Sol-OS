  <!-- MODAL 5: Detailed Task Modal & MCP Calendar Integration -->
  <div id="taskModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900" id="taskModalTitle">새 업무 일정 등록 및 연동</h2>
            <p class="text-[11px] text-slate-500" id="taskModalSub">세부 항목 직접 작성 또는 구글 캘린더·노션 연동</p>
          </div>
        </div>
        <button type="button" onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-700 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-200 gap-2 text-xs">
        <button type="button" onclick="switchTaskModalTab('direct')" id="taskTabBtnDirect" class="px-3.5 py-2 font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center gap-1.5">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>직접 세부 입력</span>
        </button>
        <button type="button" onclick="switchTaskModalTab('mcp')" id="taskTabBtnMcp" class="px-3.5 py-2 font-medium text-slate-500 hover:text-slate-900 flex items-center gap-1.5">
          <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
          <span>외부 캘린더 연동</span>
        </button>
      </div>

      <!-- TAB 1: 직접 세부 입력 폼 -->
      <form id="taskDirectForm" onsubmit="handleTaskFormSubmit(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="taskEditId" value="">
        <div>
          <label class="block font-bold text-slate-700 mb-1">업무 / 프로젝트명 <span class="text-rose-500">*</span></label>
          <input type="text" id="taskInputTitle" required placeholder="예: MVP 프론트엔드 반응형 및 결제 모듈 마무리" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">업무 분야</label>
            <select id="taskInputDomain" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-brand-500">
              <option value="client">외주 프로젝트 (클라이언트)</option>
              <option value="publishing">디지털 출판 (콘텐츠/인세)</option>
              <option value="knowledge">지식창업·강의 (교육/자문)</option>
              <option value="operation">사업 운영 및 행정</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">발주처 / 고객명</label>
            <input type="text" id="taskInputClient" placeholder="예: (주)테크솔루션즈" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">마감 일자 <span class="text-rose-500">*</span></label>
            <input type="date" id="taskInputDueDate" required value="2026-10-18" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">마감 시각</label>
            <input type="time" id="taskInputDueTime" value="18:00" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">우선순위</label>
            <select id="taskInputPriority" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-brand-500">
              <option value="높음">높음 (우선 처리)</option>
              <option value="보통" selected>보통</option>
              <option value="낮음">낮음</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">정산 예정액 (선택)</label>
            <input type="number" id="taskInputAmount" placeholder="예: 2500000" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500 font-mono">
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">세부 작업 내용 및 체크포인트</label>
          <textarea id="taskInputDesc" rows="3" placeholder="결제 모듈 최종 API 테스트 및 반응형 모바일 검수 완료 후 납품" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-brand-500"></textarea>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2">
          <button type="button" onclick="closeTaskModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
            취소
          </button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition-all">
            <span id="taskSubmitBtnText">일정 등록하기</span>
          </button>
        </div>
      </form>

      <!-- TAB 2: 외부 캘린더 연동 탭 -->
      <div id="taskMcpContainer" class="hidden space-y-3.5 text-xs">
        <!-- Google Calendar Integration -->
        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-start gap-3">
              <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                <i data-lucide="calendar" class="w-5 h-5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-slate-900 text-sm">구글 캘린더 (Google Calendar)</span>
                  <span class="px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 text-[10px] font-bold">API v3 실시간 연동</span>
                </div>
                <p class="text-[11px] text-slate-500 mt-1">Google Workspace/Gmail 캘린더의 회의 및 마감 일정을 실시간으로 수집합니다.</p>
              </div>
            </div>
            <button type="button" onclick="syncGoogleCalendarMCP()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all shrink-0">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
              <span>구글 캘린더 동기화</span>
            </button>
          </div>
          <!-- Google Calendar Feedback Box -->
          <div id="gcalModalAlert" class="hidden p-3 rounded-xl text-[11px] leading-relaxed"></div>
        </div>

        <!-- Notion Integration -->
        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shrink-0">
              <i data-lucide="database" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-900 text-sm">노션 (Notion 프로젝트 DB)</span>
                <span class="px-2 py-0.5 rounded-full bg-slate-200 text-slate-800 text-[10px] font-bold">노션 연동 지원</span>
              </div>
              <p class="text-[11px] text-slate-500 mt-1">노션 프로젝트 DB 및 스프린트 태스크 데이터베이스를 SolOS 캘린더로 연동합니다.</p>
            </div>
          </div>
          <button type="button" onclick="syncNotionMCP()" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all shrink-0">
            <i data-lucide="arrow-down-circle" class="w-3.5 h-3.5"></i>
            <span>노션 태스크 연동</span>
          </button>
        </div>

        <!-- Apple Calendar / ics -->
        <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0">
              <i data-lucide="file-up" class="w-5 h-5"></i>
            </div>
            <div>
              <div class="font-bold text-slate-900 text-sm">표준 캘린더 파일 (.ics)</div>
              <p class="text-[11px] text-slate-500 mt-1">애플 캘린더나 구글, 아웃룩에서 내보낸 .ics 파일을 업로드하여 실제 일정을 일괄 등록합니다.</p>
            </div>
          </div>
          <input type="file" id="realIcsFileInput" accept=".ics,text/calendar" class="hidden" onchange="handleRealIcsFileUpload(event)">
          <button type="button" onclick="document.getElementById('realIcsFileInput').click()" class="px-3.5 py-2 rounded-xl bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all shrink-0">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
            <span>.ics 파일 업로드</span>
          </button>
        </div>
      </div>
    </div>
  </div>
