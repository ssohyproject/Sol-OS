  <!-- MODAL: Receipt OCR Confirmation & Auto-Journaling Modal -->
  <div id="receiptConfirmModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-5 max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <i data-lucide="receipt" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900">영수증 전표 확인 및 세무 자동분개</h2>
            <p class="text-[11px] text-slate-500">인식된 상호명, 승인일시, 금액을 확인하고 계정과목을 지정합니다.</p>
          </div>
        </div>
        <button type="button" onclick="closeReceiptConfirmModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Left: Image Preview -->
        <div class="flex flex-col items-center justify-center p-3 bg-slate-50 rounded-2xl border border-slate-200 min-h-[240px]">
          <img id="receiptPreviewImg" src="" alt="영수증 미리보기" class="max-h-64 object-contain rounded-xl shadow-xs border border-slate-200">
          <span class="text-[10px] text-slate-400 mt-2 font-mono truncate max-w-full" id="receiptPreviewFileName">첨부 영수증 원본</span>
        </div>

        <!-- Right: Extracted Fields -->
        <form id="receiptConfirmForm" onsubmit="handleReceiptConfirmSubmit(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-bold text-slate-700 mb-1">가맹점명 / 적요 <span class="text-rose-500">*</span></label>
            <input type="text" id="receiptInputStore" required placeholder="예: 메가MGC커피 송파점" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 font-bold text-slate-900">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-medium text-slate-700 mb-1">승인일시 (결제일) <span class="text-rose-500">*</span></label>
              <input type="date" id="receiptInputDate" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">결제 총금액 (원) <span class="text-rose-500">*</span></label>
              <input type="number" id="receiptInputAmount" required placeholder="예: 4500" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-emerald-500 font-mono font-bold text-rose-600">
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-700 mb-1">세무 계정과목 <span class="text-rose-500">*</span></label>
            <select id="receiptInputCategory" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-emerald-500">
              <option value="복리후생비(식음료/카페)">복리후생비(식음료/카페) - 커피, 음료, 식사</option>
              <option value="사업소모품비">사업소모품비 - 문구, 사무 비품</option>
              <option value="접대비">접대비 - 거래처 미팅 식음료, 선물</option>
              <option value="여비교통비">여비교통비 - 대중교통, 택시, 유류비</option>
              <option value="지급수수료/통신">지급수수료/통신 - 통신비, 서버, 수수료</option>
              <option value="지급임차료">지급임차료 - 사무실/작업실 월세</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-medium text-slate-700 mb-1">업무 도메인</label>
              <select id="receiptInputDomain" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-emerald-500">
                <option value="operation" selected>운영 (사업경비)</option>
                <option value="client">외주</option>
                <option value="publishing">출판</option>
                <option value="knowledge">지식창업</option>
              </select>
            </div>
            <div>
              <label class="block font-medium text-slate-700 mb-1">증빙 상태</label>
              <select id="receiptInputStatus" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-emerald-500">
                <option value="신용카드전표" selected>신용카드전표</option>
                <option value="현금영수증">현금영수증</option>
                <option value="간이영수증">간이영수증</option>
                <option value="세금계산서">세금계산서</option>
              </select>
            </div>
          </div>

          <div class="pt-2 flex items-center justify-end gap-2">
            <button type="button" onclick="closeReceiptConfirmModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
              취소
            </button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm transition-all flex items-center gap-1.5">
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
              <span>장부에 등록 완료</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
