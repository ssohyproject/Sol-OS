  <!-- MODAL 7: Client Profile Registration & Edit Modal -->
  <div id="clientModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
            <i data-lucide="building-2" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-slate-900" id="clientModalTitle">거래처 기업 등록</h2>
            <p class="text-[11px] text-slate-500">기본 사업자 정보, 계약 결제 조건, 담당자 및 소통 채널 설정</p>
          </div>
        </div>
        <button type="button" onclick="closeClientModal()" class="text-slate-400 hover:text-slate-700 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="clientForm" onsubmit="handleClientFormSubmit(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="clientFormId" value="">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">기업명 (공식) <span class="text-rose-500">*</span></label>
            <input type="text" id="clientInputName" required placeholder="예: (주)테크솔루션즈" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">약칭 / 표시명</label>
            <input type="text" id="clientInputShortName" placeholder="예: 테크솔루션즈" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">사업자등록번호</label>
            <input type="text" id="clientInputBizNum" placeholder="예: 120-88-12345" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-mono">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">신뢰 등급</label>
            <select id="clientInputTier" class="w-full p-2.5 rounded-xl border border-slate-200 bg-white focus:outline-none focus:border-indigo-500 font-bold">
              <option value="우수">우수 (정산 지연 0일, 최우선 배정)</option>
              <option value="양호" selected>양호 (정상 결제, 1~3일 이내)</option>
              <option value="주의">주의 (지연 빈번, 7일 이상)</option>
              <option value="위험">위험 (14일 이상 연체, 선입금 필수)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">정기 결제일 / 약정 주기</label>
            <input type="text" id="clientInputCycle" placeholder="예: 매월 말일 마감 익월 15일" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">담당자 및 연락처</label>
            <input type="text" id="clientInputManager" placeholder="예: 김영민 이사 (010-9123-4567)" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- 소통 채널 선택 (버튼형 + 기타 직접 입력) -->
        <div>
          <label class="block font-medium text-slate-700 mb-1.5">소통 채널 (버튼을 눌러 선택)</label>
          <div class="flex flex-wrap items-center gap-1.5" id="clientChannelButtons">
            <button type="button" onclick="toggleChannelBtn('슬랙')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="슬랙">슬랙</button>
            <button type="button" onclick="toggleChannelBtn('카카오톡')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="카카오톡">카카오톡</button>
            <button type="button" onclick="toggleChannelBtn('이메일')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="이메일">이메일</button>
            <button type="button" onclick="toggleChannelBtn('노션')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="노션">노션</button>
            <button type="button" onclick="toggleChannelBtn('전화')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="전화">전화</button>
            <button type="button" onclick="toggleChannelBtn('기타')" class="channel-select-btn px-3 py-1.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition-all" data-channel="기타">기타</button>
          </div>
          <!-- 기타 입력란 (기타 선택 시 표시) -->
          <div id="clientChannelCustomWrap" class="hidden mt-2">
            <input type="text" id="clientCustomChannelInput" placeholder="기타 소통 채널 직접 입력 (예: 잔디, Discord, Zoom 등)" class="w-full p-2.5 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-indigo-500">
          </div>
          <input type="hidden" id="clientInputChannel" value="">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">보고 주기</label>
            <input type="text" id="clientInputMeeting" placeholder="예: 주간 미팅 (화 10시)" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">산출물 공유</label>
            <input type="text" id="clientInputSharing" placeholder="예: 피그마 + 깃허브" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- 필요 서류 체크리스트 편집 UI -->
        <div class="space-y-2 pt-1 border-t border-slate-100">
          <div class="flex items-center justify-between">
            <label class="block font-bold text-slate-700">필요 서류 체크리스트</label>
            <span class="text-[11px] text-slate-500">필수 관리 서류 목록을 추가 및 삭제합니다</span>
          </div>
          <div id="clientModalChecklistGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-2 p-3 bg-slate-50 rounded-2xl border border-slate-200">
            <!-- Dynamically populated via renderClientModalChecklist() -->
          </div>
          <div class="flex gap-2">
            <input type="text" id="clientModalNewDocInput" placeholder="추가 서류명 입력 (예: 개인정보처리위탁동의서)" class="flex-1 p-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-indigo-500">
            <button type="button" onclick="addClientModalDocItem()" class="px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold whitespace-nowrap">
              + 서류 추가
            </button>
          </div>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">권장 특약 및 주의 메모 (선택)</label>
          <input type="text" id="clientInputClause" placeholder="예: 착수금 50% 선입금 필수화, 무상 수정 2회 제한" class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
          <button type="button" onclick="closeClientModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold">
            취소
          </button>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-md transition-all">
            저장하기
          </button>
        </div>
      </form>
    </div>
  </div>
