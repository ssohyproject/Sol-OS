  <!-- MODAL 1: First Visit Onboarding Modal -->
  <div id="onboardingModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-3xl p-6 lg:p-8 border border-slate-200 shadow-2xl space-y-6 relative">
      <!-- Close Button -->
      <button type="button" onclick="closeOnboardingModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 p-1.5 rounded-xl hover:bg-slate-100 transition-colors" title="닫기">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 mx-auto flex items-center justify-center text-white shadow-md shadow-brand-500/20">
          <i data-lucide="shield" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl lg:text-2xl font-black text-slate-900 tracking-tight">SoloOS 시작 모드 선택</h2>
        <p class="text-xs text-slate-500">1인 사업가에게 최적화된 작업 환경을 선택해 주세요. 상단 헤더에서 언제든 전환 가능합니다.</p>
      </div>

      <!-- 2 Choices -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Dashboard Option -->
        <div onclick="selectOnboardingMode('dashboard')" class="cursor-pointer p-5 rounded-2xl bg-slate-50 hover:bg-indigo-50/40 border-2 border-brand-500 hover:border-brand-600 transition-all space-y-3 group shadow-sm">
          <div class="flex items-center justify-between">
            <div class="w-10 h-10 rounded-xl bg-brand-100 text-brand-700 flex items-center justify-center group-hover:scale-105 transition-transform">
              <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-brand-100 text-brand-800">추천</span>
          </div>
          <div>
            <h3 class="text-sm font-bold text-slate-900">대시보드형 (Cockpit)</h3>
            <p class="text-[11px] text-slate-500 mt-1">기업 통장 가용 잔고, 비주얼 손익 흐름, 3대 세무 현황을 고밀도로 한눈에 조망합니다.</p>
          </div>
        </div>

        <!-- Conversational Option -->
        <div onclick="selectOnboardingMode('conversational')" class="cursor-pointer p-5 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 transition-all space-y-3 group shadow-sm">
          <div class="flex items-center justify-between">
            <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center group-hover:scale-105 transition-transform">
              <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-200 text-slate-700">준비 중</span>
          </div>
          <div>
            <h3 class="text-sm font-bold text-slate-900">대화형 (AI Agent)</h3>
            <p class="text-[11px] text-slate-500 mt-1">자연어 대화를 통해 "부가세 10% 얼마야?", "일정 버퍼 잡아줘"와 같이 편안하게 업무를 관리합니다.</p>
          </div>
        </div>
      </div>

      <!-- Quick Action: 가상 샘플 데이터로 둘러보기 vs 초기 화면(빈 워크스페이스)으로 시작 -->
      <div class="pt-3 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-2.5">
        <button type="button" onclick="startWithSampleDemo()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm transition-all">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
          <span>가상 샘플 데이터(체험 버전)로 둘러보기</span>
        </button>
        <button type="button" onclick="closeOnboardingModal()" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs flex items-center justify-center gap-1 transition-all">
          <span>빈 화면으로 시작하기</span>
        </button>
      </div>
    </div>
  </div>
