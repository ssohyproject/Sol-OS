# ==============================================================================
# Google Cloud Build Pipeline for SolOS (Cloud Run Deployment)
# Automates Container Build, Artifact Push, and Cloud Run Rollout
# ==============================================================================

steps:
  # 1. Build Container Image with Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/soloos-erp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/soloos-erp:latest'
      - '.'

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/soloos-erp:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (Seoul: asia-northeast3)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'soloos-erp'
      - '--image=gcr.io/$PROJECT_ID/soloos-erp:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--concurrency=80'
      - '--set-env-vars=NODE_ENV=production,HOST=0.0.0.0,APP_NAME=SolOS ERP'

images:
  - 'gcr.io/$PROJECT_ID/soloos-erp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/soloos-erp:latest'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
